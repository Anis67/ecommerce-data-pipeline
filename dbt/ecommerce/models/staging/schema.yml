version: 2

models:
  - name: stg_orders
    description: "Commandes nettoyées et standardisées"
    columns:
      - name: order_id
        description: "Identifiant unique de la commande"
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ["completed", "pending", "cancelled", "refunded"]
      - name: price
        tests:
          - not_null

  - name: stg_customers
    description: "Clients uniques extraits des commandes"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique